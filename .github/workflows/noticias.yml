name: Noticias

# Cada media hora. GitHub a veces se retrasa unos minutos cuando tiene cola: da
# igual, esto no es urgente. `workflow_dispatch` deja lanzarlo a mano desde la
# pestaña Actions para probar sin esperar.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Hace falta para poder guardar la memoria de lo ya publicado en el repo.
permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Lo unico que no es libreria estandar en todo el paquete. Hace falta para
      # dibujar la portada de las noticias que llegan sin imagen; si fallara, el
      # script lo detecta y publica igual, solo que sin esa portada.
      - name: Instalar Pillow
        run: pip install --quiet pillow

      - name: Publicar lo nuevo
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MUSICBUTLER_RSS: ${{ secrets.MUSICBUTLER_RSS }}
        run: python discord_noticias.py --enserio --max 3

      # Sin esto, cada ejecucion empezaria de cero y volveria a publicar lo
      # mismo: la memoria de lo ya visto vive en el repo.
      #
      # **El `pull --rebase` no es opcional.** Si alguien ha subido algo desde
      # que este trabajo hizo checkout, el push falla, la memoria NO se guarda, y
      # a la siguiente vuelta se republica todo. Paso en la primera prueba de
      # verdad: salieron noticias duplicadas.
      - name: Recordar lo publicado
        run: |
          git config user.name "noticias-bot"
          git config user.email "noticias-bot@users.noreply.github.com"
          git add .noticias_vistas.json
          git diff --staged --quiet && echo "nada nuevo que recordar" && exit 0
          git commit -m "memoria de noticias"
          git pull --rebase --autostash origin main
          git push
