name: Roles

# **Cada 5 minutos.** Discord no deja escuchar reacciones sin estar conectado las
# 24 h, asi que esto **pregunta** quien ha reaccionado y reparte los roles. Es lo
# que hace que elegir tu color funcione con el PC de casa apagado, y ademas
# actualiza los contadores y saluda a quien acaba de entrar.
#
# Estuvo en 10 minutos mientras el repositorio era privado, porque GitHub solo
# regala 2.000 minutos al mes ahi y cada vuelta se factura redondeando al minuto:
# a este ritmo serian 8.640. Desde que el repo es **publico** los minutos son
# ilimitados, asi que la unica razon para esperar era una factura que ya no
# existe. Lo que se gana: la tarjeta de bienvenida tarda la mitad.
#
# Ojo, GitHub cumple los cron **a su ritmo**: cuando tiene cola, un */5 se
# retrasa. Es best-effort, no un reloj.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  repartir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Hace falta para dibujar la tarjeta de bienvenida del ultimo paso.
      - name: Instalar Pillow
        run: pip install --quiet pillow

      # Cada paso va con `continue-on-error`. Los tres son independientes
      # --repartir roles, renombrar contadores, saludar-- y estaban en fila
      # sin red: el 2 de septiembre una regla de limpieza apuntaba a un canal
      # borrado, el primer paso moria con un 404, y los otros dos no llegaban
      # a ejecutarse. Resultado: durante dias nadie recibio roles, los
      # contadores se congelaron y NUNCA se saludo a nadie. Un fallo, tres
      # funciones caidas, y ni un aviso.
      - name: Poner los roles al dia
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python discord_reacciones.py

      # Los numeros del servidor, escritos en el nombre de unos canales de arriba.
      # Va aqui y no en su propio trabajo porque Discord solo deja 2 cambios de
      # nombre cada 10 minutos por canal: atado a este cron, encaja justo. El
      # script solo renombra lo que cambio, asi que la mayoria de vueltas no
      # gastan ninguna peticion.
      # Los contadores se quitaron el 3-sep: la categoria «EL SERVIDOR» con
      # los cuatro numeros arriba del todo no le gustaba, y con seis miembros
      # un «Miembros - 6» en la cabecera resta mas de lo que suma. El paso se
      # queda comentado y no borrado: si algun dia vuelve a interesar, se
      # descomenta esto y se corre `discord_contadores.py --crear --enserio`.
      #
      # - name: Los contadores del servidor
      #   continue-on-error: true
      #   env:
      #     DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      #   run: python discord_contadores.py --enserio

      # La tarjeta de bienvenida. `--dias 1` a proposito: asi solo saluda a quien
      # entro de verdad hace poco. Con una ventana mas ancha, el dia que se
      # reactive el cron despues de una pausa mencionaria de golpe a gente que
      # lleva semanas dentro — y una bienvenida a destiempo es peor que ninguna.
      - name: Saludar a quien entro
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python discord_bienvenida.py --enserio --dias 1

      # ── Y AHORA SE QUEDA VIGILANDO ─────────────────────────────────────
      #
      # Una pasada cada cinco minutos significa que quien acepta las reglas
      # puede esperar entre cinco y quince minutos a que se le abra el
      # servidor -- GitHub cumple los cron a su ritmo. El dia que entra gente
      # eso es una eternidad, y la primera impresion se juega ahi.
      #
      # Como el repositorio es PUBLICO, los minutos de Actions son ilimitados:
      # la unica razon para no vigilar en continuo era una factura que no
      # existe. Asi que cada ejecucion se queda mirando las reacciones cada 15
      # segundos durante NUEVE minutos. Con el cron cada cinco, siempre hay una
      # corriendo y casi siempre dos solapadas -- cobertura continua sin que el
      # PC de casa tenga que estar encendido.
      #
      # Solaparse no hace dano: repartir un rol que ya se tiene no hace nada.
      # Y va el ULTIMO a proposito, para no retrasar los contadores ni las
      # bienvenidas, que son de una pasada.
      #
      # `timeout` devuelve 124 al cortar, que no es un fallo: por eso el `|| true`.
      - name: Vigilar las reacciones en continuo
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: timeout 540 python -u discord_reacciones.py --vigilar 15 || true
