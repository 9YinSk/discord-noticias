name: Temporada

# Los lunes a las 15:00 UTC — las 10 de la manana en Peru.
on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lo mejor valorado de la temporada
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python discord_temporada.py --enserio
